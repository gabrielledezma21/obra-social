name: Pruebas backend

on:
  push:
    branches:
      - agent/integrar-aplicaciones-2-3
  pull_request:
  workflow_dispatch:

jobs:
  pruebas-integracion:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      MONGO_URI_TEST: mongodb://127.0.0.1:27017/medintegral_test
      SECRETO_AUTENTICACION_TEST: secreto-ci-medintegral
      NODE_ENV: test

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar pruebas de integración
        run: npm test
