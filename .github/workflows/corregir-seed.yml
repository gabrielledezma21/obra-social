name: Corregir seed

on:
  push:
    branches:
      - agent/integrar-aplicaciones-2-3
  workflow_dispatch:

permissions:
  contents: write

jobs:
  corregir-seed:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          ref: agent/integrar-aplicaciones-2-3

      - name: Aplicar correcciones determinísticas
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          ruta = Path('src/reiniciarDB.js')
          texto = ruta.read_text(encoding='utf-8')

          cambios = [
              (
                  "const Usuario = require('./models/usuario');",
                  "const Contador = require('./models/contador');\nconst Usuario = require('./models/usuario');",
              ),
              (
                  "    SituacionTerapeutica.deleteMany({}),\n  ]);",
                  "    SituacionTerapeutica.deleteMany({}),\n    Contador.deleteMany({}),\n  ]);",
              ),
              (
                  "const crearHorarioAgenda = (",
                  "const INDICES_DIAS = {\n  Domingo: 0,\n  Lunes: 1,\n  Martes: 2,\n  Miercoles: 3,\n  Jueves: 4,\n  Viernes: 5,\n  Sabado: 6,\n};\n\nconst obtenerFechaParaDia = (\n  diaObjetivo,\n  { semanas = 0, pasado = false } = {}\n) => {\n  const indiceObjetivo = INDICES_DIAS[diaObjetivo];\n  if (indiceObjetivo === undefined) {\n    throw new Error(`Día inválido para la seed: ${diaObjetivo}`);\n  }\n\n  const fecha = new Date();\n  fecha.setHours(12, 0, 0, 0);\n  const indiceActual = fecha.getDay();\n\n  if (pasado) {\n    let diferencia = (indiceActual - indiceObjetivo + 7) % 7;\n    if (diferencia === 0) diferencia = 7;\n    diferencia += semanas * 7;\n    fecha.setDate(fecha.getDate() - diferencia);\n  } else {\n    let diferencia = (indiceObjetivo - indiceActual + 7) % 7;\n    if (diferencia === 0) diferencia = 7;\n    diferencia += semanas * 7;\n    fecha.setDate(fecha.getDate() + diferencia);\n  }\n\n  return fecha;\n};\n\nconst crearHorarioAgenda = (",
              ),
              ("fecha: sumarDias(3),", "fecha: obtenerFechaParaDia('Miercoles'),"),
              (
                  "fecha: sumarDias(10),",
                  "fecha: obtenerFechaParaDia('Lunes', { semanas: 1 }),",
              ),
              ("fecha: sumarDias(5),", "fecha: obtenerFechaParaDia('Jueves'),"),
              (
                  "fecha: sumarDias(-14),",
                  "fecha: obtenerFechaParaDia('Miercoles', { semanas: 1, pasado: true }),",
              ),
              (
                  "fecha: sumarDias(-45),",
                  "fecha: obtenerFechaParaDia('Lunes', { semanas: 5, pasado: true }),",
              ),
              (
                  "fecha: sumarDias(8),",
                  "fecha: obtenerFechaParaDia('Jueves', { semanas: 1 }),",
              ),
          ]

          for anterior, nuevo in cambios:
              if anterior not in texto:
                  raise SystemExit(f'No se encontró el patrón esperado: {anterior[:80]}')
              texto = texto.replace(anterior, nuevo)

          ruta.write_text(texto, encoding='utf-8')
          PY

      - name: Publicar corrección
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/reiniciarDB.js
          git commit -m "Corregir integridad y fechas de la seed"
          git push origin HEAD:agent/integrar-aplicaciones-2-3
