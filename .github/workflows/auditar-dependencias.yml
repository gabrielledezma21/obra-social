name: Auditar dependencias backend

on:
  push:
    branches:
      - agent/integrar-aplicaciones-2-3
  workflow_dispatch:

jobs:
  auditoria:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Mostrar auditoría completa
        shell: bash
        run: |
          npm audit --json > auditoria.json || true
          cat auditoria.json
